name: 01 - Building Block

on: push


jobs:
    echo-hello:
        runs-on: ubuntu-latest
        steps:
            - name: Say hello
              uses: echo "Hello, World!"
    echo-goodbye:
        runs-on: ubuntu-latest
        steps:
            - name: Failed step
              run: |
                echo "I will fail"
                exit 1
            - name: Say goodbye
              uses: echo "Goodbye, World!"